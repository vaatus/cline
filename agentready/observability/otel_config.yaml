# OpenTelemetry config generated by AgentReady for cline
# Captures every tool call as a span attribute and every Judge verdict as a metric.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  attributes/agent:
    actions:
      - key: agent.slug
        value: cline
        action: insert
      - key: agent.framework
        value: unknown
        action: insert

exporters:
  logging:
    loglevel: info
  otlphttp:
    endpoint: ${LANGFUSE_HOST}/otel

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, attributes/agent]
      exporters: [logging, otlphttp]
    metrics:
      receivers: [otlp]
      processors: [batch, attributes/agent]
      exporters: [logging, otlphttp]

